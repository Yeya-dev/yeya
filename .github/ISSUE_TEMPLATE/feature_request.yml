name: 功能建议
description: 描述你的阅读场景与希望改善的体验。
title: "[建议] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        这是公开反馈区域。请勿上传 API Key、密码、Token、私人书籍或含个人数据的日志；截图和附件请先脱敏。
  - type: textarea
    id: situation
    attributes:
      label: 使用场景与当前问题
      description: 你希望完成什么？现在的操作为什么不方便？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的效果
      description: 描述理想的使用结果；不必提供实现方案。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代办法（可选）
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我知道反馈会公开，并已移除凭据、私人书籍及个人信息。
          required: true
