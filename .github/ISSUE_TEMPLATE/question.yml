name: 使用咨询
description: 询问页芽 Yeya 的功能或操作方法。
title: "[咨询] "
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        这是公开反馈区域。请勿上传 API Key、密码、Token、私人书籍或含个人数据的日志；截图和附件请先脱敏。
  - type: textarea
    id: question
    attributes:
      label: 具体问题
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 相关功能与操作步骤
      description: 说明问题出现在哪个入口或哪一步。
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: 已查看的说明或已尝试的办法
      description: 尚未尝试时请写明，方便我们补充说明。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我知道反馈会公开，并已移除凭据、私人书籍及个人信息。
          required: true
