name: 报告问题
description: 告诉我们哪里没有按预期工作。
title: "[问题] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。这是公开区域，所有人都可能看到内容。
        请勿上传 API Key、密码、Token、私人书籍或含个人数据的日志；截图和附件请先脱敏。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 你当时在做什么？遇到了什么问题？
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: 请提供版本及构建号；无法确认时可填写「不清楚」。
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iOS 版本与设备型号
      placeholder: 例如 iOS 版本、iPhone 型号；不要填写设备序列号。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序说明操作；不要附上私人书籍，必要时可用自写的短示例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的截图或简短日志（可选）
      description: 只提供定位问题所需的最少内容；移除个人信息和凭据后再附上。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我知道反馈会公开，并已移除凭据、私人书籍及个人信息。
          required: true
